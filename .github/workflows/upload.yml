name: Upload to App Store

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA from release
        run: |
          gh release download v1.0 --pattern "*.ipa" --repo itay227700/tipsplit-ios-submit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.API_KEY_P8 }}
        run: |
          fastlane run upload_to_app_store \
            ipa:"ios-2.121943.2.ipa" \
            skip_metadata:true \
            skip_screenshots:true \
            submit_for_review:false
